name: Keep Streamlit App Alive

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the Streamlit app
        run: |
          echo "Pinging https://lexport-anonymous.streamlit.app/ ..."
          status=$(curl -s -o /dev/null -w "%{http_code}" -L https://lexport-anonymous.streamlit.app/)
          echo "Received HTTP status: $status"
          if [ "$status" -ge 400 ]; then
            echo "App did not respond successfully."
            exit 1
          fi
